<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="divineway_logo/divineway_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service — DivinewayFengshui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;500;700&family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="nav_style.css">
  <link rel="stylesheet" href="footer_style.css">
  <link rel="stylesheet" href="auth_styles.css">
  <script type="module" src="firebase-auth.js"></script>
  <script src="config.js"></script>
  <style>
    /* .article-wrapper { background: linear-gradient(to right, #070707, #1a1a1a, #2e2e2e);} */
    .article-sec { max-width: 1000px; margin: 0 auto; padding: 50px 0 50px 0; }
    .article-back { font-family: var(--sans); font-size: 12px; color: var(--gold-dim); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 28px; }
    .article-back:hover { color: var(--gold); }
    .article-image { width: 100%; max-height: 500px; object-fit: cover; border-radius: 8px; margin-bottom: 28px; display: none; }
    .article-title { font-family: var(--serif); font-size: 30px; font-weight: 400; color: var(--cream); line-height: 1.3; margin-bottom: 14px; }
    .article-subtitle { font-size: 14px; font-weight: 300; color: var(--text-muted); font-family: var(--sans); line-height: 1.75; margin-bottom: 28px; }
    .article-body { font-size: 13px; font-weight: 300; color: #fff; line-height: 1.2; }
    /* ERPNext's Quill editor */
    .article-body, .article-body * { color: #fff !important; }
    .article-body h1, .article-body h2, .article-body h3 { font-family: var(--serif); color: var(--cream) !important; font-weight: 500 !important; margin: 15px 0 10px 0; }
    .article-body p { margin: 0 0 10px; }
    .article-body a { color: var(--gold-dim) !important; text-decoration: underline; text-underline-offset: 3px; }
    .article-body a:hover { color: var(--gold) !important; }
    .article-body img { max-width: 100%; border-radius: 6px; margin: 12px 0; }
    .article-body ul, .article-body ol { padding-left: 20px; margin: 0 0 18px; }
    .article-body li { margin-bottom: 6px; }
    .article-body blockquote { border-left: 2px solid var(--gold-border); padding-left: 16px; margin: 0 0 18px; color: var(--text-muted); }
    .article-cta { margin-top: 36px; }
  </style>
</head>
<body>

<div class="article-wrapper">

  <script src="nav.js"></script>

  <section class="article-sec">
    <a class="article-back" href="services.html"><i class="ti ti-arrow-left"></i> Back to Services</a>

    <!-- Loading state -->
    <div id="article-loading" style="text-align:center;padding:60px 0">
      <div class="shop-spinner"></div>
      <p style="font-size:13px;color:var(--text-muted);font-family:var(--sans);margin-top:16px;font-weight:300">Fetching service from ERPNext…</p>
    </div>

    <!-- Error state -->
    <div id="article-error" style="display:none;text-align:center;padding:60px 0;background:var(--cream-faint);border:1px solid rgba(201,168,76,0.15);border-radius:8px">
      <div style="font-size:32px;margin-bottom:12px">⚠️</div>
      <p style="font-size:14px;color:var(--cream);font-family:var(--sans);font-weight:500;margin-bottom:6px" id="article-error-title">Could not load service</p>
      <p style="font-size:12px;color:var(--text-muted);font-family:var(--sans);font-weight:300;margin-bottom:20px" id="article-error-msg"></p>
      <button onclick="loadService()" style="background:var(--gold);color:var(--ink-deep);border:none;padding:10px 24px;border-radius:4px;font-size:12px;font-family:var(--sans);font-weight:600;cursor:pointer;letter-spacing:.06em;text-transform:uppercase">Retry</button>
    </div>

    <div id="article-content" style="display:none">
      <img class="article-image" id="article-image" alt="" loading="lazy">
      <h1 class="article-title" id="article-title"></h1>
      <p class="article-subtitle" id="article-subtitle"></p>
      <div class="article-body" id="article-body"></div>
      <button class="hcta article-cta" id="article-enquire">Enquire Now</button>
    </div>

  </section>

  <!-- FOOTER -->
  <script src="footer.js"></script>

</div>

<script src="cart.js"></script>
<script>
const SERVICE_WORKER_URL = (window.ERPNEXT_CONFIG || {}).stripe_worker_url || 'https://divineway.kah-yan.workers.dev';
const serviceName = new URLSearchParams(window.location.search).get('name');

async function loadService() {
  const loading = document.getElementById('article-loading');
  const errorEl = document.getElementById('article-error');
  const content = document.getElementById('article-content');

  loading.style.display = 'block';
  errorEl.style.display = 'none';
  content.style.display = 'none';

  if (!serviceName) {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    document.getElementById('article-error-title').textContent = 'No service specified';
    document.getElementById('article-error-msg').textContent = 'Missing ?name= reference in the URL.';
    return;
  }

  const MAX_RETRIES = 3;
  let lastErr;

  for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
    try {
      if (attempt > 1) await new Promise(r => setTimeout(r, 3000 * (attempt - 1)));

      const res = await fetch(`${SERVICE_WORKER_URL}/service-post?name=${encodeURIComponent(serviceName)}`);
      if (!res.ok) throw new Error(`Worker responded ${res.status} ${res.statusText}`);
      const { service, error } = await res.json();
      if (error || !service) throw new Error(error || 'Service not found');

      renderService(service);
      loading.style.display = 'none';
      content.style.display = 'block';
      return;
    } catch (err) {
      lastErr = err;
      console.warn(`⚠️ Attempt ${attempt}/${MAX_RETRIES} failed:`, err.message);
    }
  }

  loading.style.display = 'none';
  errorEl.style.display = 'block';
  document.getElementById('article-error-msg').textContent = lastErr.message;
}

function renderService(s) {
  document.title = `${s.name} — DivinewayFengshui`;

  const imgEl = document.getElementById('article-image');
  if (s.image) {
    imgEl.src = s.image;
    imgEl.style.display = 'block';
  }

  document.getElementById('article-title').textContent = s.name;
  document.getElementById('article-subtitle').textContent = s.short_description || '';

  const bodyEl = document.getElementById('article-body');
  bodyEl.innerHTML = s.long_description || '<p>More details coming soon.</p>';

  document.getElementById('article-enquire').addEventListener('click', () => {
    const msg = `Hello Master Louis, I am interested in ${s.name}.`;
    window.open(`${WA_BASE}?text=${encodeURIComponent(msg)}`, '_blank');
  });
}

loadService();
</script>
</body>
</html>
