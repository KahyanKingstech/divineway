<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="divineway_logo/divineway_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In â€” DivinewayFengshui</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;500;700&family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script type="module" src="firebase-auth.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0e0c09;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 40%, rgba(201,168,76,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 60%, rgba(122,26,0,0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      background: #12100d;
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .login-logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .login-logo-text strong {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 600;
      color: #c9a84c;
      letter-spacing: .04em;
      text-align: left;
    }
    .login-logo-text span {
      display: block;
      font-family: 'Noto Serif SC', serif;
      font-size: 11px;
      color: rgba(201,168,76,0.5);
      text-align: left;
      margin-top: 1px;
    }

    .login-divider {
      width: 40px;
      height: 1px;
      background: rgba(201,168,76,0.25);
      margin: 0 auto 28px;
    }

    .login-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 600;
      color: #f7f0e3;
      margin-bottom: 10px;
      letter-spacing: .02em;
    }
    .login-sub {
      font-size: 13px;
      color: rgba(247,240,227,0.4);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #fff;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .btn-google:hover { background: #f5f5f5; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .btn-google:disabled { opacity: .6; cursor: not-allowed; }

    .login-note {
      margin-top: 20px;
      font-size: 11px;
      color: rgba(247,240,227,0.25);
      line-height: 1.6;
    }

    .login-back {
      display: inline-block;
      margin-top: 24px;
      font-size: 12px;
      color: rgba(201,168,76,0.5);
      text-decoration: none;
      transition: color .15s;
    }
    .login-back:hover { color: #c9a84c; }

    .login-error {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(192,57,43,0.15);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: 5px;
      font-size: 12px;
      color: #e07060;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

<div class="login-card">

  <a href="index.html" class="login-logo">
    <div class="login-logo-icon">
      <img src="divineway_logo/divineway_logo.png"
           onerror="this.style.display='none';this.parentNode.innerHTML='<span style=&quot;font-family:serif;color:#c9a84c;font-size:20px&quot;>é“</span>'">
    </div>
    <div class="login-logo-text">
      <strong>DivinewayFengshui</strong>
      <span>é£Žæ°´ Â· é“å®¶æ³•æœ¯ Â· ç¬¦å’’</span>
    </div>
  </a>

  <div class="login-divider"></div>

  <h1 class="login-title">Welcome Back</h1>
  <p class="login-sub">Sign in to track your orders and access your account.</p>

  <button class="btn-google" id="google-btn" onclick="handleGoogleSignIn()">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continue with Google
  </button>

  <div class="login-error" id="login-error"></div>

  <p class="login-note">By signing in you agree to our terms. Your data is only used to track your orders.</p>

  <a href="javascript:history.back()" class="login-back">â† Go back</a>

</div>

<script>
  // Redirect if already logged in
  function checkAuth() {
    if (window.__currentUser) {
      const ret = new URLSearchParams(location.search).get('returnUrl') || 'shop.html';
      location.href = ret;
    }
  }
  // Poll briefly for Firebase to initialise (onAuthStateChanged fires async)
  let _poll = 0;
  const _timer = setInterval(() => {
    checkAuth();
    if (++_poll >= 10) clearInterval(_timer);
  }, 300);

  async function handleGoogleSignIn() {
    const btn = document.getElementById('google-btn');
    const errEl = document.getElementById('login-error');
    btn.disabled = true;
    btn.textContent = 'Signing inâ€¦';
    errEl.style.display = 'none';
    try {
      await window.__signIn();
      const ret = new URLSearchParams(location.search).get('returnUrl') || 'shop.html';
      location.href = ret;
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google`;
      errEl.textContent = err.code === 'auth/popup-closed-by-user' ? 'Sign-in cancelled.' : 'Sign-in failed: ' + err.message;
      errEl.style.display = 'block';
    }
  }
</script>
</body>
</html>
